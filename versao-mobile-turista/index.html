<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valise — mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6b8e23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Valise Manager">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
</head>
<body>

  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark"><img src="../assets/Logo T01.png" alt="Valise" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'fas fa-suitcase-rolling'}))"></div>
        <div class="brand-name">VALISE MANAGER</div>
      </div>
      <div class="topbar-right">
        <div class="trip-badge"><i class="fas fa-plane"></i><span id="tripBadgeName">Todas as viagens</span></div>
        <button class="icon-btn" id="btnFileMenu" title="Arquivo"><i class="fas fa-ellipsis-vertical"></i></button>
      </div>
    </div>
    <div class="trip-scroller" id="tripScroller"></div>
  </div>

  <!-- ===== Card Diário ===== -->
  <div class="screen active" id="screen-cards"><div class="list" id="cardsList"></div></div>

  <!-- ===== Checklist ===== -->
  <div class="screen" id="screen-checklist"><div class="list" id="checkList"></div></div>

  <!-- ===== Links & Endereços ===== -->
  <div class="screen" id="screen-links">
    <div class="links-toolbar">
      <div class="search-wrap"><i class="fas fa-magnifying-glass"></i><input type="text" id="linkSearch" placeholder="Buscar nome ou endereço..."></div>
      <div class="cat-scroller" id="linkCatScroller"></div>
    </div>
    <div class="list" id="linksList" style="padding-top:6px;"></div>
  </div>

  <button class="fab" id="fabAdd" title="Adicionar"><i class="fas fa-plus"></i></button>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <!-- Sheet: arquivo (salvar / abrir) -->
  <div class="sheet" id="sheetFile">
    <div class="sheet-handle"></div>
    <div class="sheet-title serif">Arquivo</div>
    <div class="file-status"><i class="fas fa-circle-check" id="fileStatusIcon"></i><span id="fileStatusText">Nenhum arquivo carregado ainda — usando dados de exemplo</span></div>
    <div class="file-row" id="btnSaveFile">
      <div class="ico"><i class="fas fa-floppy-disk"></i></div>
      <div><div class="txt-main">Salvar arquivo</div><div class="txt-sub">Baixa um .json com viagens, checklist e links</div></div>
    </div>
    <div class="file-row" id="btnOpenFile">
      <div class="ico"><i class="fas fa-folder-open"></i></div>
      <div><div class="txt-main">Abrir arquivo</div><div class="txt-sub">Carrega um .json salvo antes (deste app ou do desktop)</div></div>
    </div>
    <input type="file" id="fileInput" accept=".json" style="display:none">
    <div class="sheet-actions"><button class="btn-cancel" id="fileSheetClose" style="flex:1; text-align:center;">Fechar</button></div>
  </div>

  <!-- Sheet: novo item do checklist -->
  <div class="sheet" id="sheetCheck">
    <div class="sheet-handle"></div>
    <div class="sheet-title serif">Novo item</div>
    <label>O que levar / fazer?</label>
    <input type="text" id="sheetInput" placeholder="Ex: Carregador de câmera">
    <label>Categoria</label>
    <div class="chip-row" id="sheetCats"></div>
    <input type="text" id="sheetNewCat" placeholder="Ou digite uma nova categoria..." style="margin-top:8px;">
    <div class="sheet-actions">
      <button class="btn-cancel" id="sheetCancel">Cancelar</button>
      <button class="btn-add" id="sheetConfirm">Adicionar</button>
    </div>
  </div>

  <!-- Sheet: novo/editar link -->
  <div class="sheet" id="sheetLink">
    <div class="sheet-handle"></div>
    <div class="sheet-title serif" id="linkSheetTitle">Novo local</div>
    <label>Nome / Local</label>
    <input type="text" id="lkName" placeholder="Ex: Consulado dos EUA">
    <label>Categoria</label>
    <div class="chip-row" id="lkCats"></div>
    <label>Endereço</label>
    <input type="text" id="lkAddress" placeholder="Ex: 1234 Main St, New York">
    <div class="field-row">
      <div><label>Telefone</label><input type="tel" id="lkPhone" placeholder="+1 (212) 000-0000"></div>
      <div><label>Website</label><input type="url" id="lkUrl" placeholder="https://..."></div>
    </div>
    <label>Observações</label>
    <input type="text" id="lkNotes" placeholder="Horário, documentos necessários...">
    <input type="hidden" id="lkEditId">
    <div class="sheet-actions">
      <button class="btn-cancel" id="linkSheetCancel">Cancelar</button>
      <button class="btn-add" id="linkSheetConfirm">Salvar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <nav class="bottomnav">
    <button class="nav-btn active" data-tab="cards"><i class="fas fa-calendar-day"></i>Card Diário</button>
    <button class="nav-btn" data-tab="checklist"><i class="fas fa-list-check"></i>Checklist</button>
    <button class="nav-btn" data-tab="links"><i class="fas fa-link"></i>Links</button>
  </nav>

<script src="script.js"></script>
</body>
</html>
